# ============================================================================
# REDIS CONFIGURATION FOR SOCIAL MEDIA PLATFORM
# ============================================================================

# Network and Connection Settings
bind 0.0.0.0
port 6379
protected-mode yes
tcp-backlog 511
timeout 300
tcp-keepalive 300

# General Settings
daemonize no
supervised no
pidfile /var/run/redis_6379.pid
loglevel notice
logfile ""
databases 16

# Security
# requirepass will be set via command line
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command KEYS ""
# rename-command CONFIG ""

# Memory Management
maxmemory 256mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Persistence Configuration
save 900 1
save 300 10
save 60 10000

stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# AOF Configuration
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# Slow Log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Event Notification
notify-keyspace-events "Ex"

# Client Settings
timeout 0
tcp-keepalive 300
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Advanced Configuration
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64
hll-sparse-max-bytes 3000
stream-node-max-bytes 4096
stream-node-max-entries 100
activerehashing yes
hz 10
dynamic-hz yes

# Lazy Freeing
lazyfree-lazy-eviction no
lazyfree-lazy-expire no
lazyfree-lazy-server-del no
replica-lazy-flush no

# Threaded I/O
# io-threads 4
# io-threads-do-reads no

# Social Media Platform Specific Settings
# ===========================================

# Session Management
# Used for storing user sessions and JWT tokens
# Keys: session:${userId}, jwt:${tokenId}
# TTL: Based on JWT expiration (typically 24 hours)

# Caching Strategy
# User profiles: user:profile:${userId} (TTL: 1 hour)
# Post data: post:${postId} (TTL: 30 minutes)
# Feed cache: feed:${userId}:${type} (TTL: 10 minutes)
# Conversation cache: conversation:${conversationId} (TTL: 1 hour)

# Real-time Features
# Pub/Sub channels for WebSocket messaging
# online_users: Set of currently online user IDs
# typing_indicators: Hash of conversation_id -> user_id -> timestamp
# presence: Hash of user_id -> last_seen_timestamp

# Rate Limiting
# rate_limit:${ip}:${endpoint} (TTL: window duration)
# rate_limit:${userId}:${action} (TTL: window duration)

# Message Queues
# message_queue:${conversationId} (List for message delivery)
# notification_queue:${userId} (List for notifications)

# Analytics and Metrics
# metrics:daily:${date} (Hash of various counters)
# metrics:user:${userId} (Hash of user-specific metrics)

# Performance Optimizations for Social Media Workload
# ====================================================

# Optimize for frequent read/write operations
hash-max-ziplist-entries 1024
hash-max-ziplist-value 128

# Optimize for message lists
list-max-ziplist-size -1
list-compress-depth 1

# Optimize for user sets (followers, following)
set-max-intset-entries 1024

# Optimize for sorted sets (trending posts, leaderboards)
zset-max-ziplist-entries 256
zset-max-ziplist-value 128

# Enable keyspace notifications for real-time features
notify-keyspace-events "KEA"

# Increase client buffer for WebSocket connections
client-output-buffer-limit pubsub 64mb 16mb 60

# Log slow queries for optimization
slowlog-log-slower-than 5000

# Replication settings (if using Redis Sentinel/Cluster)
# ======================================================
# replica-serve-stale-data yes
# replica-read-only yes
# repl-diskless-sync no
# repl-diskless-sync-delay 5
# repl-ping-replica-period 10
# repl-timeout 60
# repl-disable-tcp-nodelay no
# repl-backlog-size 1mb
# repl-backlog-ttl 3600

# Cluster settings (if using Redis Cluster)
# =========================================
# cluster-enabled yes
# cluster-config-file nodes-6379.conf
# cluster-node-timeout 15000
# cluster-replica-validity-factor 10
# cluster-migration-barrier 1
# cluster-require-full-coverage yes

# Custom modules (if any)
# =======================
# loadmodule /path/to/redis-module.so

# Monitoring and Debugging
# ========================
# Enable command renaming for security in production
# rename-command DEBUG ""
# rename-command SHUTDOWN SHUTDOWN_SECRET_KEY

# Custom commands for social media platform
# rename-command EVAL EVAL_SOCIAL_PLATFORM
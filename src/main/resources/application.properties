# ============================================================================
# SOCIAL MEDIA PLATFORM - APPLICATION PROPERTIES
# ============================================================================

# Application Configuration
spring.application.name=social-media-web-app
spring.profiles.active=development

# ============================================================================
# DATABASE CONFIGURATION (MySQL)
# ============================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/social_media_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000

# ============================================================================
# JPA & HIBERNATE CONFIGURATION
# ============================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.jdbc.order_inserts=true
spring.jpa.properties.hibernate.jdbc.order_updates=true

# ============================================================================
# REDIS CONFIGURATION
# ============================================================================
spring.redis.host=${REDIS_HOST}
spring.redis.port=${REDIS_PORT}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.database=0
spring.redis.timeout=2000ms
spring.redis.lettuce.pool.max-active=20
spring.redis.lettuce.pool.max-idle=10
spring.redis.lettuce.pool.min-idle=5
spring.redis.lettuce.pool.max-wait=-1ms

# ============================================================================
# CACHE CONFIGURATION
# ============================================================================
spring.cache.type=redis
spring.cache.redis.time-to-live=1800000
spring.cache.redis.cache-null-values=false

# ============================================================================
# SCHEDULING CONFIGURATION
# ============================================================================
spring.task.scheduling.pool.size=5
spring.task.scheduling.thread-name-prefix=scheduled-

spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=async-

# ============================================================================
# METRICS CONFIGURATION
# ============================================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus

management.metrics.export.prometheus.enabled=true

management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=${spring.profiles.active:default}

# ============================================================================
# SESSION MANAGEMENT CONFIGURATION
# ============================================================================
app.session.cleanup.enabled=true
app.session.cleanup.cron=0 0 */6 * * *

app.session.monitoring.enabled=true
app.session.monitoring.cron=0 0 * * * *

app.session.max-active-sessions=10000
app.session.alert-threshold=8000

# ============================================================================
# SECURITY CONFIGURATION
# ============================================================================
spring.security.require-ssl=false

# ============================================================================
# CORS CONFIGURATION
# ============================================================================
spring.web.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:8080}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
spring.web.cors.max-age=3600

# ============================================================================
# WEBSOCKET CONFIGURATION
# ============================================================================
websocket.enabled=true
websocket.cors.allowed-origins=${CORS_ORIGINS:CORS_ALLOWED_ORIGINS}
websocket.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
websocket.cors.allowed-headers=*
websocket.cors.allow-credentials=true
websocket.max-text-message-size=8192
websocket.max-binary-message-size=131072

# ============================================================================
# JWT CONFIGURATION
# ============================================================================
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration-ms=${APP_JWT_ACCESS_TOKEN_EXPIRATION_MS}
app.jwt.refresh-token-expiration-ms=${APP_JWT_REFRESH_TOKEN_EXPIRATION_MS}
# ============================================================================
# FILE UPLOAD CONFIGURATION
# ============================================================================
file.upload-dir=${UPLOAD_DIR:uploads}
file.max-file-size=${MAX_FILE_SIZE:10485760}
file.allowed-types=image/jpeg,image/png,image/gif,video/mp4
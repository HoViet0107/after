# ============================================================================
# SOCIAL MEDIA PLATFORM - APPLICATION PROPERTIES
# ============================================================================

# Application Configuration
spring.application.name=social-media-web-app
spring.profiles.active=development

# ============================================================================
# DATABASE CONFIGURATION (MySQL)
# ============================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/social_media_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000

# ============================================================================
# JPA & HIBERNATE CONFIGURATION
# ============================================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.jdbc.order_inserts=true
spring.jpa.properties.hibernate.jdbc.order_updates=true

# ============================================================================
# REDIS CONFIGURATION
# ============================================================================
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.database=0
spring.redis.timeout=2000ms
spring.redis.lettuce.pool.max-active=20
spring.redis.lettuce.pool.max-idle=10
spring.redis.lettuce.pool.min-idle=5
spring.redis.lettuce.pool.max-wait=-1ms

# ============================================================================
# CACHE CONFIGURATION
# ============================================================================
spring.cache.type=redis
spring.cache.redis.time-to-live=1800000
spring.cache.redis.cache-null-values=false

# ============================================================================
# SECURITY CONFIGURATION
# ============================================================================
spring.security.require-ssl=false

# ============================================================================
# CORS CONFIGURATION
# ============================================================================
spring.web.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:8080}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
spring.web.cors.max-age=3600

# ============================================================================
# WEBSOCKET CONFIGURATION
# ============================================================================
websocket.enabled=true
websocket.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:8080}
websocket.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
websocket.cors.allowed-headers=*
websocket.cors.allow-credentials=true
websocket.max-text-message-size=8192
websocket.max-binary-message-size=131072

# ============================================================================
# JWT CONFIGURATION
# ============================================================================
jwt.secret=${JWT_SECRET:z0UPwGEn0XiT35ZIQwq1vtGjMwdU6Zpd}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ============================================================================
# FILE UPLOAD CONFIGURATION
# ============================================================================
file.upload-dir=${UPLOAD_DIR:uploads}
file.max-file-size=${MAX_FILE_SIZE:10485760}
file.allowed-types=image/jpeg,image/png,image/gif,video/mp4